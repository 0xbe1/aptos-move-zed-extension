name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Check, Lint, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Toolchain, targets, and components all come from rust-toolchain.toml
      # (single source of truth). The runner's preinstalled rustup reads that
      # file and auto-installs what it needs — no third-party action pinned to
      # a moving branch.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --target wasm32-wasip2 -- -D warnings

      - name: Build WASM
        run: cargo build --locked --target wasm32-wasip2 --release
