name = "Move.toml"
grammar = "toml"
; Matches files named exactly "Move.toml" in any directory. Zed scores
; suffix matches by length, so this wins over the generic TOML language's
; "toml" suffix, and it will not match files like "myMove.toml".
path_suffixes = ["Move.toml"]
line_comments = ["# "]
autoclose_before = ",]}"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
